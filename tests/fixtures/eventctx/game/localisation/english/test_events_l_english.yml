l_english:
 germany.75.t:0 "The §YDanzig§! Question"
 germany.75.d:0 "The Polish government has refused to discuss the status of the Free City. §RPublic opinion§! at home is split on how hard we should press.\n\nThe Foreign Ministry asks how to proceed."
 germany.75.a:0 "Press for the return of Danzig"
 germany.75.b:0 "Offer a guarantee of the Polish border"
 germany.75.c:0 "Wait for Germany to blink"
 germany.75.e:0 "Mobilise the reserve"
 germany.76.t:0 "[FROM.GetNameDef] demands Danzig"
 germany.76.d:0 "A note from [FROM.GetLeader] arrives at the chancellery, demanding the corridor to East Prussia."
 germany.76.a:0 "Refuse the demand"
 germany.76.b:0 "Answer with force"
 generic.shared.t:0 "A Quiet Season"
 generic.1.d:0 "Harvests were good this year and the farmers are content with the price of grain."
 generic.1.a:0 "Good news for the countryside"
 generic.2.d:0 "Dockworkers in the northern ports have walked off the job over wages and hours."
 generic.2.a:0 "Break the strike"
 generic.2.b:0 "Negotiate with the union"
 poland.1.t:0 "Mobilisation Orders"
 poland.1.d_war:0 "The army calls up its reserves while the front is burning."
 poland.1.d_peace:0 "The general staff drafts quiet orders for the autumn exercises."
 poland.1.a:0 "Understood"
 world.1.t:0 "Crisis in the Rhineland"
 world.1.d:0 "Troops march into the demilitarised zone and the powers of Europe watch."
 world.1.a:0 "Ominous"
 germany.99.t:0 "Hidden title"
 germany.99.a:0 "Hidden"
